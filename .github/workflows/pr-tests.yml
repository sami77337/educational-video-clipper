name: Python regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_FFMPEG_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Confirm actual FFmpeg
        run: ffmpeg -version
      - name: Run regression suite
        run: python -m pytest -q -rs


  windows-pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_FFMPEG_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Add bundled FFmpeg to Windows test PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pwd 'tools')
      - name: Confirm actual FFmpeg on Windows
        run: ffmpeg -version
      - name: Run Windows regression suite
        run: python -m pytest -q -rs

  windows-preview-build:
    name: Build Windows preview (review only)
    runs-on: windows-latest
    needs: [pytest, windows-pytest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable EXE and package
        shell: cmd
        run: call build_app_ci.bat
      - name: Audit contents (must include FFmpeg)
        shell: pwsh
        run: |
          python scripts/check_release_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Release package audit failed' }
          if (-not (Test-Path 'dist/AlmiqsAlBaseet/AlmiqsAlBaseet.exe')) {
            throw 'Windows executable missing'
          }
          if (-not (Test-Path 'dist/AlmiqsAlBaseet/ffmpeg.exe')) {
            throw 'Bundled FFmpeg missing'
          }
      - name: Save build manifest
        shell: pwsh
        run: |
          $exe = Get-FileHash 'dist/AlmiqsAlBaseet/AlmiqsAlBaseet.exe' -Algorithm SHA256
          $info = @(
            'INTERNAL PREVIEW ONLY - NOT FINAL RELEASE',
            "Head commit: ${{ github.event.pull_request.head.sha }}",
            "Executable SHA256: $($exe.Hash)",
            'Tests: Ubuntu + Windows + real FFmpeg test required',
            'Transcription: External Telegram bot (not bundled)',
            'Install: keep the entire AlmiqsAlBaseet folder',
            'Source: Pull Request #56'
          )
          $info | Out-File -FilePath 'dist/AlmiqsAlBaseet/PREVIEW_BUILD_INFO.txt' -Encoding utf8
      - name: Upload Windows portable preview
        uses: actions/upload-artifact@v4
        with:
          name: AlmiqsAlBaseet-Windows-Preview-PR56
          path: dist/AlmiqsAlBaseet/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
