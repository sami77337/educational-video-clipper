name: Python regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_FFMPEG_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Confirm actual FFmpeg
        run: ffmpeg -version
      - name: Run regression suite
        run: python -m pytest -q -rs


  windows-pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_FFMPEG_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Add bundled FFmpeg to Windows test PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pwd 'tools')
      - name: Confirm actual FFmpeg on Windows
        run: ffmpeg -version
      - name: Run Windows regression suite
        run: python -m pytest -q -rs
