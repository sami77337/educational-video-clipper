name: Check live YouTube on Windows
on:
  push:
    branches: ["test/windows-youtube-smoke-20261008"]
permissions:
  contents: read
jobs:
  youtube-smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install current downloader and Deno
        shell: pwsh
        run: |
          python -m pip install --upgrade --pre "yt-dlp[default]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\prepare_youtube_runtime.ps1 -DestinationDir "$pwd\tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attempt public test-video download with TLS verification
        shell: pwsh
        run: |
          $process = Start-Process python -ArgumentList @('-u', 'scripts/youtube_smoke.py') -PassThru -RedirectStandardOutput 'youtube-smoke.stdout.log' -RedirectStandardError 'youtube-smoke.stderr.log'
          if (-not $process.WaitForExit(150000)) {
            $process.Kill()
            '{"status":"inconclusive","reason":"live download timed out after 150 seconds"}' | Set-Content -Encoding utf8 youtube-smoke.json
          }
          if (Test-Path youtube-smoke.json) { Get-Content youtube-smoke.json } else { throw 'Smoke report missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-YouTube-live-smoke
          path: |
            youtube-smoke.json
            youtube-smoke.stdout.log
            youtube-smoke.stderr.log
          if-no-files-found: error
          retention-days: 7
