name: Verify Windows package restore helper
on:
  push:
    branches: ["test/windows-youtube-smoke-20261008"]
permissions:
  contents: read
jobs:
  restore-helper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Test restore, missing part, and no-overwrite safeguards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'restore-helper-test'
          New-Item -ItemType Directory -Path "$root\fixture\AlmiqsAlBaseet" -Force | Out-Null
          Set-Content -Path "$root\fixture\AlmiqsAlBaseet\AlmiqsAlBaseet.exe" -Value 'Synthetic test placeholder - never executed'
          Compress-Archive -Path "$root\fixture\AlmiqsAlBaseet" -DestinationPath "$root\fixture.zip"
          $expected = (Get-FileHash "$root\fixture.zip" -Algorithm SHA256).Hash
          $helper = [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String(''))
          $helper = $helper.Replace('22c950b40d05d8cbaa1bee78c0b915411b7b5383e27aa658fc5192a812076248', $expected)
          $bytes = [IO.File]::ReadAllBytes("$root\fixture.zip")
          $chunkSize = [int][Math]::Ceiling($bytes.Length / 6.0)
          foreach ($case in @('success', 'missing', 'existing')) {
            $folder = Join-Path $root $case
            New-Item -ItemType Directory -Path $folder | Out-Null
            [IO.File]::WriteAllText("$folder\START-RESTORE.cmd", $helper, [Text.Encoding]::ASCII)
            for ($i = 0; $i -lt 6; $i++) {
              if ($case -eq 'missing' -and $i -eq 5) { continue }
              $offset = $i * $chunkSize
              $length = [Math]::Min($chunkSize, $bytes.Length - $offset)
              $part = New-Object byte[] $length
              [Array]::Copy($bytes, $offset, $part, 0, $length)
              $name = 'AlmiqsAlBaseet-Windows-x64-1.0.1.zip.{0:D3}' -f ($i + 1)
              [IO.File]::WriteAllBytes((Join-Path $folder $name), $part)
            }
            $zip = "$folder\AlmiqsAlBaseet-Windows-x64-1.0.1.zip"
            if ($case -eq 'existing') { Set-Content $zip 'Existing user file sentinel' }
            Push-Location $folder
            & $env:ComSpec /d /c 'echo. | START-RESTORE.cmd'
            $result = $LASTEXITCODE
            Pop-Location
            if ($case -eq 'success') {
              if ($result -ne 0) { throw 'Success fixture failed' }
              if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Restored ZIP differs' }
              if (-not (Test-Path "$folder\AlmiqsAlBaseet-fixed-1.0.1\AlmiqsAlBaseet\AlmiqsAlBaseet.exe")) { throw 'Not extracted' }
            } else {
              if ($result -eq 0) { throw 'Failure fixture unexpectedly succeeded' }
              if ($case -eq 'missing' -and (Test-Path $zip)) { throw 'Missing-part case created output' }
              if ($case -eq 'existing' -and (Get-Content $zip -Raw).Trim() -ne 'Existing user file sentinel') { throw 'Existing output changed' }
            }
            Write-Host "PASS: $case"
          }
          $global:LASTEXITCODE = 0
