name: Build verified Windows portable app

on:
  push:
    branches: ["fix/windows-youtube-repair-20261007"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install and test source
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --upgrade --pre "yt-dlp[default]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\tools;$env:PATH"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows app
        shell: pwsh
        run: |
          $env:ALMIQS_PYTHON = (Get-Command python).Source
          cmd /c build_app_ci.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run packaged application self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\AlmiqsAlBaseet\AlmiqsAlBaseet.exe').Path
          $report = Join-Path $pwd 'packaged-self-test.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$report`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Packaged application self-test timed out'
          }
          $process.WaitForExit()
          $process.Refresh()
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged application self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Packaged checks did not pass' }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\AlmiqsAlBaseet' -DestinationPath 'AlmiqsAlBaseet-Windows-x64-1.0.1.zip' -CompressionLevel Optimal
          Get-FileHash 'AlmiqsAlBaseet-Windows-x64-1.0.1.zip' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AlmiqsAlBaseet-Windows-x64-1.0.1
          path: AlmiqsAlBaseet-Windows-x64-1.0.1.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-verification-report
          path: packaged-self-test.json
          if-no-files-found: ignore
          retention-days: 7
